{% extends 'base.html' %}

{% block title %}Iniciar tarea de anotación{% endblock %}

{% block override_style %}
{% endblock %}

{% block content %}
<div class="container my-4">
  <h1 class="h4 mb-4 fw-bold">Subir archivo y lanzar tarea</h1>

  <!-- Nav tabs to switch between FASTA (annotation) and FASTQ (sequencing) -->
  <ul class="nav nav-tabs" id="fileTypeTabs" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link active" id="fasta-tab" data-bs-toggle="tab" data-bs-target="#fasta" type="button" role="tab" aria-controls="fasta" aria-selected="true">FASTA / Anotación</button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="fastq-tab" data-bs-toggle="tab" data-bs-target="#fastq" type="button" role="tab" aria-controls="fastq" aria-selected="false">FASTQ / Secuenciación</button>
    </li>
  </ul>

  <div class="tab-content mt-3">
    <div class="tab-pane fade show active" id="fasta" role="tabpanel" aria-labelledby="fasta-tab">
      <form id="upload-form-fasta" method="post" enctype="multipart/form-data" action="{% url 'converter:annotation_task' %}">
        {% csrf_token %}
        <input type="hidden" name="task_type" value="annotation">
        <div class="mb-3">
          <label class="form-label">Archivo FASTA:
            <input type="file" name="fasta_file" accept=".fasta,.fa" required class="form-control">
          </label>
        </div>
        <button type="submit" class="btn btn-primary">Iniciar anotación</button>
      </form>
    </div>

    <div class="tab-pane fade" id="fastq" role="tabpanel" aria-labelledby="fastq-tab">
      <form id="upload-form-fastq" method="post" enctype="multipart/form-data" action="{% url 'converter:sequencing_task' %}">
        {% csrf_token %}
        <select id="sequencingTypeSelect" name="sequencing_type" class="form-select mb-3" required>
          <option value="" disabled selected>Tipo de secuenciación</option>
          <option value="illumina">Illumina</option>
          <option value="ont">ONT</option>
        </select>
        <input type="hidden" name="task_type" value="sequencing">
        <div id="fastqFile1Wrapper" class="mb-3" style="display:none;">
          <label class="form-label">Archivo FASTQ (read 1):
            <input id="fastq_file_1" type="file" name="fastq_file" accept=".fastq,.fq,.fastq.gz,.fq.gz" class="form-control">
          </label>
        </div>
        <div id="fastqFile2Wrapper" class="mb-3" style="display:none;">
          <label class="form-label">Archivo FASTQ (read 2):
            <input id="fastq_file_2" type="file" name="fastq_file_2" accept=".fastq,.fq,.fastq.gz,.fq.gz" class="form-control">
          </label>
        </div>
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" name="annotate" id="annotateCheckbox">
          <label class="form-check-label" for="annotateCheckbox">
            Realizar anotación automática después de la secuenciación (proceso más largo)
          </label>
        </div>
        <button type="submit" class="btn btn-primary">Iniciar secuenciación</button>
      </form>
    </div>
  </div>

  <script>
    // Disable submit button on submit to prevent double submits
    document.addEventListener('DOMContentLoaded', function () {
      // generic disable for simple forms
      ['upload-form-fasta'].forEach(function(id) {
        const form = document.getElementById(id);
        if (!form) return;
        form.addEventListener('submit', function(e) {
          if (!form.checkValidity()) return;
          const btn = form.querySelector('button[type="submit"]');
          if (btn) btn.disabled = true;
        });
      });

      // specialized handler for FASTQ form because Illumina needs two files
      const fastqForm = document.getElementById('upload-form-fastq');
      const seqSelect = document.getElementById('sequencingTypeSelect');
      const fastqFile1Wrapper = document.getElementById('fastqFile1Wrapper');
      const fastqFile1 = document.getElementById('fastq_file_1');
      const fastqFile2Wrapper = document.getElementById('fastqFile2Wrapper');
      const fastqFile2 = document.getElementById('fastq_file_2');

      if (seqSelect) {
        // show file inputs only after sequencing type is selected
        seqSelect.addEventListener('change', function () {
          if (!seqSelect.value) {
            fastqFile1Wrapper.style.display = 'none';
            fastqFile2Wrapper.style.display = 'none';
            fastqFile2.required = false;
            fastqFile1.required = false;
            fastqFile1.value = null;
            fastqFile2.value = null;
            return;
          }

          // show read1 always once a type is chosen
          fastqFile1Wrapper.style.display = 'block';
          fastqFile1.required = true;

          if (seqSelect.value === 'illumina') {
            fastqFile2Wrapper.style.display = 'block';
            fastqFile2.required = true;
          } else {
            fastqFile2Wrapper.style.display = 'none';
            fastqFile2.required = false;
            fastqFile2.value = null;
          }
        });
      }

      if (fastqForm) {
        fastqForm.addEventListener('submit', function (e) {
          // validate Illumina requires two files
          if (seqSelect && seqSelect.value === 'illumina') {
            const f1 = document.getElementById('fastq_file_1');
            const f2 = document.getElementById('fastq_file_2');
            if (!f1 || !f2 || !f1.value || !f2.value) {
              e.preventDefault();
              alert('Para Illumina debe subir dos archivos FASTQ (read 1 y read 2).');
              return;
            }
          }

          if (!fastqForm.checkValidity()) return;
          const btn = fastqForm.querySelector('button[type="submit"]');
          if (btn) btn.disabled = true;
        });
      }
    });
  </script>
</div>

{% endblock %}
