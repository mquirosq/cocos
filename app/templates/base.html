{% load static %}
<!doctype html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{% block title %}TFG{% endblock %}</title>

    <!-- Zephyr Bootswatch -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5/dist/zephyr/bootstrap.min.css">

    <!-- Navbar style -->
    <link rel="stylesheet" href="{% static 'css/includes/navbar.css' %}">

    <!-- Footer style -->
    <link rel="stylesheet" href="{% static 'css/includes/footer.css' %}">

    {% block override_style %}{% endblock %}

</head>
<body>
    {% include 'includes/navbar.html' %}

    {% if messages %}
    <div class="container">

        {% for message in messages %}
            <div class="alert {% if 'error' in message.tags %}alert-danger{% elif 'success' in message.tags %}alert-success{% elif 'warning' in message.tags %}alert-warning{% else %}alert-info{% endif %} alert-dismissible fade show my-4" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    </div>
    {% endif %}
    {% block content %}{% endblock %}
</body>

{% include 'includes/footer.html' %}

</html>
