# Para desarrollo

services:
  postgres:
    image: postgres:16-alpine
    container_name: bio-web-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tfg}
      POSTGRES_USER: ${POSTGRES_USER:-tfg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tfg_password}
    volumes:
      - postgres_data_web:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-tfg} -d ${POSTGRES_DB:-tfg}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      bio-network:
        aliases:
          - bio-web-postgres

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ../app:/app
    # Ejecutar con UID 1000 - No arrancar como root
    user: "1000:1000"
    ports:
      - "8080:8000"
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - bio-network

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: sh -c "export PYTHONPATH=/app && celery -A app worker -l info"
    volumes:
      - ../app:/app
    # Ejecutar con UID 1000 - No arrancar como root
    user: "1000:1000"
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - bio-network

  redis:
    image: redis:7
    container_name: bio-web-redis
    volumes:
      - redis_data_web:/data
    networks:
      bio-network:
        aliases:
          - bio-web-redis

networks:
  bio-network:
    external: true
    name: bio-network

volumes:
  postgres_data_web:
  redis_data_web:
